# SowGuard node firmware (nRF52840-DK). Based on Nordic's peripheral_lbs sample.

# Default settings Nordic uses in its samples (logging over UART, etc.)
CONFIG_NCS_SAMPLES_DEFAULTS=y

# Bluetooth LE, peripheral role (the phone is the central)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SowGuard"

# Connection parameters the board asks the phone for (the phone has the final say).
# Default was 30-50 ms. We send one frame every 2 s, so 400-500 ms is enough, and
# fewer radio events (1) make the DHT11 fail less (BLE interrupts break its
# timing, measured 4 Nov) and (2) save energy.
# Interval unit = 1.25 ms: 320 = 400 ms, 400 = 500 ms.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=320
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=400
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
# Supervision timeout (unit 10 ms): link considered lost after 4 s without packets.
# BLE requires it to be bigger than 2 x interval (here 1 s).
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# No pairing/bonding (decided 28 Oct, see docs/protocol.md): CONFIG_BT_SMP is not enabled.

# Nordic library for the DK's LEDs and buttons
CONFIG_DK_LIBRARY=y

# Sensor API + DHT11 driver (the driver is enabled automatically because the
# overlay in boards/ declares an "aosong,dht" device).
# CONFIG_DHT_LOCK_IRQS stays off (default): it uses irq_lock(), which cannot block
# the radio interrupts (they are zero-latency), so it would not fix the failed reads.
# It would only delay the other interrupts ~22 ms every 2 s. Not tested.
CONFIG_SENSOR=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
